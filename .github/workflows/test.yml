name: Test

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout liblouis-env (pinned release, see liblouis-env.version)
        run: |
          VERSION=$(cat liblouis-env.version)
          git clone --branch "$VERSION" --depth 1 https://github.com/brailletools/liblouis-env.git "${{ github.workspace }}/../liblouis-env"

      - uses: prefix-dev/setup-pixi@v0.10.0
        with:
          environments: dev

      - name: Run tests
        run: pixi run -e dev test

      # The editor ships js/src, and until now no workflow ran its tests. Tests that
      # need the sibling `dataset` checkout (sample photos, models) skip themselves.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: JS tests
        run: cd js && npm ci && npm test
